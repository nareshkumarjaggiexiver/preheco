[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heco-common"
version = "0.1.0"
description = "Shared schemas, imaging helpers, env config and planner client for the HECO pipeline services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[tool.setuptools.packages.find]
include = ["heco_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
