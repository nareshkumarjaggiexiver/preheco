# TensorRT overlay — HECO_DEVICE=TRT (fp16) for persons, faces and embed.
#
# Layer it LAST, on top of the GPU-max overlay (which supplies the CUDA
# images, the GPU reservation and the restricted-tier model env):
#
#   HECO_TRT=1 ./scripts/build-images.sh   # or, by hand, each of:
#   docker build -f docker/persons-cuda.Dockerfile --build-arg BASE=heco-persons --build-arg WITH_TENSORRT=1 -t heco-persons:cuda .
#   docker build -f docker/persons-cuda.Dockerfile --build-arg BASE=heco-faces   --build-arg WITH_TENSORRT=1 -t heco-faces:cuda   .
#   docker build -f docker/persons-cuda.Dockerfile --build-arg BASE=heco-embed   --build-arg WITH_TENSORRT=1 -t heco-embed:cuda   .
#   HECO_CPUSET= PERSONS_MODEL=yolox_s.onnx \
#   FACES_MODEL=scrfd_10g_kps.onnx FACES_SCRFD_INPUT=1472x832 \
#   EMBED_MODEL=models/arcface_w600k_r50.onnx HECO_EMBEDDING_DIM=512 HECO_EMBEDDER_ID=arcface-w600k-r50 \
#   docker compose -f docker-compose.yml -f docker-compose.gpumax.yml -f docker-compose.trt.yml up -d
#
# The images must carry TensorRT: docker/persons-cuda.Dockerfile installs
# tensorrt-cu13-libs 10.16 only with WITH_TENSORRT=1 (opt-in since f1b2f07 —
# it made every GPU image 12.9 GB). An image without it answers /health
# requested=TRT with no TensorRT in `active` and `trt: null` — CUDA fp32,
# slower, never wrong. HECO_CUDA_TAG picks another tag.
#
# WHAT IT BUYS (4060, eight 4K frames of the Sharon bench clip, session.run
# median, fp32 CUDA -> fp16 TensorRT): YOLOX-s 640 7.1 -> 3.3 ms; SCRFD-10G
# 1472x832 20.0 -> 5.4 ms (640: 7.5 -> 2.5); ArcFace-R50 23.3 -> 8.6 ms per
# 5.5-face frame (3.7 with EMBED_BATCH=1). Parity against fp32 on 40 frames:
# no person or face gained or lost at score 0.5 or 0.7, no gender flips;
# person IoU p1 0.987 (min 0.93, a partial person), face IoU min 0.987,
# landmarks within 0.30 px, ArcFace cosine min 0.9997 (0.9999 for faces
# >= 56 px), feature norm within 1.1%. VRAM per stack under TRT: persons
# 190 MiB, faces 250 MiB, embed 330 MiB.
#
# WHAT IT COSTS: a COLD START. TensorRT builds one engine per model, input
# shape and GPU — measured cold on the 4060: YOLOX-s 157 s, SCRFD-10G 34 s,
# ArcFace 32-38 s, genderage 20 s — and these run inside the first /health,
# so the healthcheck's start period below is sized for three stacks
# building at once on one card. Every later start deserialises from the
# volume in under a second. The cache is per compose PROJECT (volumes are
# project-scoped): two stacks never write one engine file at the same time.
# Engines sit in <HECO_TRT_CACHE>/<first 12 hex of the weights' sha256>
# (heco_common/ort.py model_key), so changed WEIGHTS are a new engine and a
# cold build whatever the file is called — the EP's own engine name ignores
# the weights, and until 2026-09-25 a same-architecture swap or an in-place
# re-fetch silently ran the old engine. FACES_SCRFD_INPUT, EMBED_BATCH, a
# new GPU or TensorRT version are cold builds too. The first start after
# that re-key builds every engine once; the old ones sit unused at the root.
#
# Rollback is total: drop this -f and the fp32 CUDA arm returns untouched
# (the cache volume just sits unused).
services:
  persons:
    environment:
      HECO_DEVICE: TRT
      HECO_TRT_CACHE: /srv/trt-cache/persons
    volumes:
      - trt-cache:/srv/trt-cache
    healthcheck:
      start_period: 900s

  faces:
    environment:
      HECO_DEVICE: TRT
      HECO_TRT_CACHE: /srv/trt-cache/faces
    volumes:
      - trt-cache:/srv/trt-cache
    healthcheck:
      start_period: 900s

  embed:
    environment:
      HECO_DEVICE: TRT
      HECO_TRT_CACHE: /srv/trt-cache/embed
    volumes:
      - trt-cache:/srv/trt-cache
    healthcheck:
      start_period: 900s

volumes:
  trt-cache:
